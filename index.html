<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Task Manager</h1>
<form id="form" class="row"><input id="text" placeholder="Add a task…" maxlength="120" required aria-label="New task"><button class="primary">Add</button></form>
<div class="card">
<div class="filters row"><button data-f="all">All</button><button data-f="active">Active</button><button data-f="done">Done</button></div>
<ul id="list"></ul><p id="empty" class="muted" hidden>Nothing here yet.</p>
<div class="row foot"><span id="count" class="muted"></span><button id="clear">Clear completed</button></div>
</div></main><script src="script.js"></script></body></html>
